<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber-Gen Terminal</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="d-flex h-100 cyber-grid">

  <div id="sidebar" class="cyber-sidebar p-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="neon-text-blue m-0" style="font-size:0.9rem; letter-spacing:2px;">
        <i class="fa-solid fa-brain me-2"></i>MEMORIA
      </h4>
      <button id="close-sidebar" class="btn cyber-btn-icon"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="branding-zone mb-3 p-2 text-center">
      <div style="font-family:var(--font-title); font-size:0.75rem; letter-spacing:2px; color:#fff;">
        CYBER-GEN <span class="neon-text-pink">TERMINAL</span>
      </div>
    </div>
    <hr class="cyber-hr">
    <div class="history-container mb-3">
      <div style="font-size:0.65rem; color:var(--text-muted);">SESIONES</div>
      <ul id="history-list" class="list-unstyled"></ul>
    </div>
    <div class="mt-auto d-flex flex-column gap-2">
      <button id="btn-download-session" class="btn cyber-btn-blue w-100" style="font-size:0.75rem;">
        <i class="fa-solid fa-file-export me-1"></i> Exportar sesion
      </button>
      <button id="clear-btn" class="btn cyber-btn-red w-100" style="font-size:0.75rem;">
        <i class="fa-solid fa-trash-can me-1"></i> Purgar memoria
      </button>
    </div>
  </div>

  <div class="flex-grow-1 d-flex flex-column cyber-main">
    <header class="px-3 py-2 d-flex justify-content-between align-items-center cyber-header">
      <div class="d-flex align-items-center gap-2">
        <button id="toggle-sidebar" class="btn cyber-btn-icon"><i class="fa-solid fa-bars"></i></button>
        <h2 class="neon-text-pink m-0 d-none d-sm-block" style="font-size:0.9rem; letter-spacing:3px;">
          <i class="fa-solid fa-microchip me-2"></i>NUCLEO IA
        </h2>
      </div>
      <div class="d-flex align-items-center gap-2">
        <div class="model-status" id="model-status">Neural Link...</div>
      </div>
    </header>

    <div id="chat-box" class="flex-grow-1 overflow-auto" style="padding:16px 20px;">
      <div class="message system-msg">
        <div class="msg-content">
          <i class="fa-solid fa-satellite-dish me-2" style="color:var(--neon-blue);"></i>
          Neural Link activo. Escribe tu primer prompt o adjunta un archivo.
        </div>
      </div>
    </div>

    <div id="file-preview-zone" class="px-3 py-2 d-none"></div>

    <div class="px-3 py-2 cyber-input-area">
      <form id="chat-form" class="d-flex gap-2 align-items-end">
        <div class="d-flex gap-1 flex-shrink-0">
          <label for="file-upload" class="btn cyber-btn-icon" title="Adjuntar archivo">
            <i class="fa-solid fa-paperclip"></i>
          </label>
          <input type="file" id="file-upload" multiple class="d-none">
        </div>
        <textarea id="prompt-input" class="form-control cyber-textarea flex-grow-1" rows="1"
          placeholder="Escribe tu prompt... (Enter para enviar)"></textarea>
        <button type="submit" id="send-btn" class="btn cyber-btn-blue"><i class="fa-solid fa-bolt"></i></button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/main.js"></script>
</body>
</html>
